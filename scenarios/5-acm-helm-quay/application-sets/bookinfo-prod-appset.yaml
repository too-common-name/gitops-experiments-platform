apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: bookinfo-prod
  namespace: openshift-gitops
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  generators:
    - clusterDecisionResource:
        configMapRef: acm-placement
        labelSelector:
          matchLabels:
            cluster.open-cluster-management.io/placement: prod-placement
        requeueAfterSeconds: 180
  template:
    metadata:
      name: 'bookinfo-prod-{{name}}'
    spec:
      project: bookinfo-project
      source:
        repoURL: 'quay.io/rh-ee-drossi'
        chart: bookinfo
        targetRevision: '0.1.0'
        helm:
          valuesObject:
            productpage:
              replicas: 1
            details:
              replicas: 1
            reviews:
              v1:
                replicas: 1
              v2:
                replicas: 1
              v3:
                replicas: 1
            ratings:
              replicas: 1
      destination:
        server: '{{server}}'
        namespace: bookinfo
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
          - CreateNamespace=true
